<script>
const ITEMS=JSON.parse(document.getElementById('product-data').textContent);const q=document.getElementById('q');const list=document.getElementById('list');const empty=document.getElementById('empty');
const el=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls;if(text!==undefined)e.textContent=text;return e};
function render(){const term=q.value.trim().replace(/^#/,'').toLowerCase();const rows=ITEMS.filter(it=>!term||String(it.no)===term||(it.name+' '+it.desc).toLowerCase().includes(term)).sort((a,b)=>b.no-a.no);list.replaceChildren();for(const it of rows){const li=el('li','');const a=el('a','product');a.href=it.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',it.no+'번 '+it.name+' 네이버스토어에서 보기');const thumb=el('span','thumb');const img=el('img','');img.src=it.img;img.alt=it.name;img.loading='lazy';thumb.append(img,el('span','number',it.no+'번'));const copy=el('span','copy');copy.append(el('div','name',it.name),el('div','desc',it.desc),el('div','go','네이버스토어에서 보기 ↗'));a.append(thumb,copy);li.append(a);list.append(li)}document.getElementById('count').textContent='제품 '+rows.length+'개';empty.hidden=rows.length>0;empty.textContent=ITEMS.length?'찾는 제품이 없어요. 번호나 제품명을 다시 확인해 주세요.':'인스타그램에 소개되는 제품을 이곳에 차곡차곡 모을게요.';}
q.addEventListener('input',render);function fromHash(){if(/^#\d+$/.test(location.hash))q.value=location.hash.slice(1);render()}window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
