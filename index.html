<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZZIM 살림템</title>
<meta name="description" content="@zzim_store 영상 속 살림템 모음">
<style>
  :root { --bg:#F5F3EF; --card:#FFFFFF; --ink:#222; --sub:#6E6862; --point:#E8A62E; --line:#E7E2DA; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
  header { text-align:center; margin-bottom:16px; }
  .brand { color:var(--point); font-weight:700; font-size:14px; letter-spacing:.04em; }
  h1 { margin:6px 0 4px; font-size:24px; }
  .lead { margin:0; color:var(--sub); font-size:14px; }
  .notice { background:#FFF8EA; border:1px solid #F3DDB0; border-radius:12px; padding:10px 12px; font-size:12px; color:#6B5420; line-height:1.5; margin:16px 0; }
  .search { width:100%; padding:14px 16px; border:1px solid var(--line); border-radius:12px; font-size:16px; background:#fff; }
  ul { list-style:none; padding:0; margin:16px 0 0; display:grid; gap:12px; }
  li a { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; color:inherit; text-decoration:none; }
  li a:active { transform:scale(.99); }
  .thumb { position:relative; flex:none; width:88px; height:88px; border-radius:12px; overflow:hidden; background:#fff; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .no { position:absolute; left:6px; top:6px; background:var(--ink); color:#fff; font-size:12px; font-weight:700; border-radius:8px; padding:2px 7px; }
  .name { font-weight:700; font-size:16px; line-height:1.35; }
  .desc { color:var(--sub); font-size:13px; margin-top:4px; line-height:1.4; }
  .go { margin-top:8px; font-size:13px; font-weight:700; color:var(--point); }
  .empty { text-align:center; color:var(--sub); padding:24px 0; display:none; }
  footer { text-align:center; color:var(--sub); font-size:12px; margin-top:28px; line-height:1.6; }
  footer a { color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ZZIM 살림템</div>
    <h1>영상 속 제품 모음</h1>
    <p class="lead">릴스에서 본 번호로 찾아보세요</p>
  </header>

  <div class="notice">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>

  <input class="search" id="q" type="search" inputmode="search" placeholder="번호 또는 제품명 검색 (예: 1, 오리)" aria-label="번호 또는 제품명 검색">

  <ul id="list"></ul>
  <p class="empty" id="empty">찾는 제품이 없어요. 번호를 다시 확인해 주세요.</p>

  <footer>
    가격과 재고는 쿠팡에서 바뀔 수 있어요.<br>
    인스타그램 <a href="https://www.instagram.com/zzim_store/">@zzim_store</a>
  </footer>
</div>

<script>
// 새 상품은 맨 위에 추가한다 (번호는 릴스 캡션의 '프로필 링크 N번'과 같게)
const ITEMS = [
  { no: 7, name: "Hakuna Matata 발매트", desc: "60×40cm 논슬립 · 블루/아이보리", img: "img/7.jpg", url: "https://link.coupang.com/a/idmKONqDgO" },
  { no: 6, name: "양 모양 러그", desc: "60×75cm 극세사 · 논슬립 바닥", img: "img/6.jpg", url: "https://link.coupang.com/a/idmJ6JW8Xc" },
  { no: 5, name: "펠트 이너백 (백인백)", desc: "33×19×9cm 가방 속 정리 · 5가지 컬러", img: "img/5.jpg", url: "https://link.coupang.com/a/idmJoio4ey" },
  { no: 4, name: "레드 그린 체크 테이블보", desc: "110×110cm 눈꽃 · 방울 테두리", img: "img/4.jpg", url: "https://link.coupang.com/a/idmIghV0km" },
  { no: 3, name: "팝잇 구구단 보드", desc: "누르면서 외우는 12단 곱셈판 · 1~100 숫자판", img: "img/3.jpg", url: "https://link.coupang.com/a/iddxqa204q" },
  { no: 2, name: "여행용 실리콘 공병 세트", desc: "공병 · 스프레이 · 크림통 · 투명 파우치", img: "img/2.jpg", url: "https://link.coupang.com/a/iddzlsbITA" },
  { no: 1, name: "생각하는 오리 가방걸이 (블랙)", desc: "책상 모서리에 끼우는 무타공 가방 후크", img: "img/1.jpg", url: "https://link.coupang.com/a/iddv67COey" },
];

const list = document.getElementById("list");
const empty = document.getElementById("empty");
function render(q) {
  q = (q || "").trim().toLowerCase();
  const rows = ITEMS.filter(it => !q || String(it.no) === q || (it.name + " " + it.desc).toLowerCase().includes(q));
  list.innerHTML = rows.map(it => `
    <li><a href="${it.url}" target="_blank" rel="noopener sponsored">
      <span class="thumb"><img src="${it.img}" alt="" loading="lazy"><span class="no">${it.no}</span></span>
      <span><div class="name">${it.no}. ${it.name}</div><div class="desc">${it.desc}</div><div class="go">쿠팡에서 보기 →</div></span>
    </a></li>`).join("");
  empty.style.display = rows.length ? "none" : "block";
}
document.getElementById("q").addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
</html>
